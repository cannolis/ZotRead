<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <title>ZotRead</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 18px 22px;
      margin: 0;
      box-sizing: border-box;
      background: #fafafa;
      color: #222;
      user-select: none;
      overflow: hidden;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 600;
    }
    progress {
      width: 100%;
      height: 18px;
      margin-bottom: 8px;
    }
    #status {
      color: #555;
      font-style: italic;
      font-size: 12px;
      min-height: 18px;
      line-height: 1.4;
      word-break: break-all;
    }
    .row {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
    button {
      padding: 6px 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #bbb;
      background: #f0f0f0;
      border-radius: 3px;
    }
    button:hover { background: #e6e6e6; }
    button:disabled { color: #aaa; cursor: default; }
  </style>
</head>
<body>
  <h2 id="title">ZotRead — Rescoring…</h2>
  <progress id="bar" max="100" value="0"></progress>
  <div id="status">…</div>
  <div class="row">
    <button id="stop">Stop</button>
  </div>
</body>
</html>
